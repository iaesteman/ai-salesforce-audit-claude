<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F7FBFE"/>
      <stop offset="100%" stop-color="#EDF4F9"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1E7FA4"/>
      <stop offset="60%"  stop-color="#2E9E8A"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="bottomBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F5A623"/>
      <stop offset="40%"  stop-color="#2E9E8A"/>
      <stop offset="100%" stop-color="#1E7FA4"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="900" height="340" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <!-- Clipped container -->
  <g clip-path="url(#rounded)">

    <!-- Background -->
    <rect width="900" height="340" fill="url(#bg)"/>

    <!-- Top accent bar -->
    <rect x="0" y="0" width="900" height="5" fill="url(#topBar)"/>

    <!-- Left teal sidebar stripe -->
    <rect x="0" y="5" width="4" height="282" fill="#1E7FA4" opacity="0.35"/>

    <!-- Gold accent line above title -->
    <rect x="28" y="24" width="72" height="4" fill="#F5A623" rx="2"/>

    <!-- Main title -->
    <text x="28" y="64"
          font-family="'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="40" font-weight="700" fill="#155A76" letter-spacing="0.5">
      AI Salesforce Audit
    </text>

    <!-- Subtitle -->
    <text x="28" y="86"
          font-family="'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="14.5" fill="#5A7A8A" letter-spacing="0.2">
      Claude Code Skills for Salesforce Audit of any Org
    </text>

    <!-- Horizontal divider -->
    <line x1="28" y1="100" x2="872" y2="100" stroke="#C8DCE6" stroke-width="1"/>

    <!-- ─── COLUMN 1  x=28 ──────────────────────────────── -->

    <!-- /sf-audit -->
    <text x="28" y="124" font-family="'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1E7FA4">/sf-audit</text>
    <text x="28" y="138" font-family="'Segoe UI', Helvetica, sans-serif" font-size="10.5" fill="#6B8599">Full audit · all 9 domains in parallel</text>

    <!-- /sf-audit-security -->
    <text x="28" y="161" font-family="'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1E7FA4">/sf-audit-security</text>
    <text x="28" y="175" font-family="'Segoe UI', Helvetica, sans-serif" font-size="10.5" fill="#6B8599">Profiles · perm sets · sharing · MFA</text>

    <!-- /sf-audit-data -->
    <text x="28" y="198" font-family="'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1E7FA4">/sf-audit-data</text>
    <text x="28" y="212" font-family="'Segoe UI', Helvetica, sans-serif" font-size="10.5" fill="#6B8599">Contacts · accounts · duplicates · leads</text>

    <!-- /sf-audit-automation -->
    <text x="28" y="235" font-family="'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1E7FA4">/sf-audit-automation</text>
    <text x="28" y="249" font-family="'Segoe UI', Helvetica, sans-serif" font-size="10.5" fill="#6B8599">Flows · Process Builder · Workflow Rules</text>

    <!-- ─── COLUMN 2  x=316 ─────────────────────────────── -->

    <!-- /sf-audit-architecture -->
    <text x="316" y="124" font-family="'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1E7FA4">/sf-audit-architecture</text>
    <text x="316" y="138" font-family="'Segoe UI', Helvetica, sans-serif" font-size="10.5" fill="#6B8599">Limits · custom objects · API versions</text>

    <!-- /sf-audit-coverage -->
    <text x="316" y="161" font-family="'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1E7FA4">/sf-audit-coverage</text>
    <text x="316" y="175" font-family="'Segoe UI', Helvetica, sans-serif" font-size="10.5" fill="#6B8599">Apex coverage % · classes below 75%</text>

    <!-- /sf-audit-naming -->
    <text x="316" y="198" font-family="'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1E7FA4">/sf-audit-naming</text>
    <text x="316" y="212" font-family="'Segoe UI', Helvetica, sans-serif" font-size="10.5" fill="#6B8599">Classes · triggers · fields · flows · VRs</text>

    <!-- /sf-audit-orphaned -->
    <text x="316" y="235" font-family="'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1E7FA4">/sf-audit-orphaned</text>
    <text x="316" y="249" font-family="'Segoe UI', Helvetica, sans-serif" font-size="10.5" fill="#6B8599">Inactive flows · dead validation rules</text>

    <!-- ─── COLUMN 3  x=604 ─────────────────────────────── -->

    <!-- /sf-audit-descriptions -->
    <text x="604" y="124" font-family="'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1E7FA4">/sf-audit-descriptions</text>
    <text x="604" y="138" font-family="'Segoe UI', Helvetica, sans-serif" font-size="10.5" fill="#6B8599">Missing help text · fields · flows · objects</text>

    <!-- /sf-audit-field-sprawl -->
    <text x="604" y="161" font-family="'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1E7FA4">/sf-audit-field-sprawl</text>
    <text x="604" y="175" font-family="'Segoe UI', Helvetica, sans-serif" font-size="10.5" fill="#6B8599">100+ field objects · stale · duplicates</text>

    <!-- /sf-audit-report-pdf -->
    <text x="604" y="198" font-family="'Courier New', monospace" font-size="12.5" font-weight="700" fill="#1E7FA4">/sf-audit-report-pdf</text>
    <text x="604" y="212" font-family="'Segoe UI', Helvetica, sans-serif" font-size="10.5" fill="#6B8599">14-page PDF with per-domain charts</text>

    <!-- ─── FOOTER ─────────────────────────────────────── -->
    <rect x="0" y="287" width="900" height="53" fill="#DFF0F7" opacity="0.7"/>
    <line x1="0" y1="287" x2="900" y2="287" stroke="#C8DCE6" stroke-width="1"/>

    <text x="450" y="319"
          font-family="'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="11.5" fill="#3D5166" text-anchor="middle" letter-spacing="0.3">
      11 skills · 9 parallel agents · 1 PDF script · read-only SOQL · local reports only
    </text>

    <!-- Bottom accent bar -->
    <rect x="0" y="335" width="900" height="5" fill="url(#bottomBar)"/>

  </g>

  <!-- Outer border -->
  <rect width="900" height="340" rx="14" ry="14" fill="none" stroke="#C8DCE6" stroke-width="1"/>
</svg>
